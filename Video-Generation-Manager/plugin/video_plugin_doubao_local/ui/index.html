<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../plugin-sdk.css"><style>body{font:13px sans-serif;padding:18px;color:#ddd;background:#202124}label{display:block;margin:14px 0}input,select{display:block;width:100%;box-sizing:border-box;margin-top:5px;padding:9px;background:#151719;color:#eee;border:1px solid #444;border-radius:6px}button{padding:9px 14px;margin:8px 6px 8px 0;cursor:pointer}p,small{color:#aaa}#status{white-space:pre-wrap;overflow-wrap:anywhere}input[type=checkbox]{display:inline-block;width:auto}</style></head><body><h3>豆包本地创作台</h3><p>先启动管理器并登录账号，再提交视频任务。</p><label>连接文件<input id="connection_file"></label><label>平台<select id="platform"><option value="doubao">豆包</option><option value="dola">Dola</option></select></label><label>账号 ID（留空自动选择）<input id="account_id"></label><label>模型（留空使用网页设置）<input id="model"></label><label>时长<select id="duration"><option value="">使用网页设置</option><option value="4">4秒</option><option value="5">5秒</option><option value="10">10秒</option><option value="15">15秒</option><option value="30">30秒</option></select></label><label>画幅（留空使用网页设置）<input id="ratio"></label><label>超时秒数<input id="timeout" type="number" min="60" max="14400"></label><label><input id="remove_watermark" type="checkbox"> 下载官方无水印原片</label><button id="save">保存</button><button id="test">测试连接 / 任务列表</button><button id="cancel">取消本插件运行任务</button><small>宿主运行中的调用没有取消令牌；请在管理器或这里取消。</small><pre id="status"></pre><script src="../../../plugin-sdk.js"></script><script>
const keys=['connection_file','platform','account_id','model','duration','ratio','timeout','remove_watermark'];
PluginSDK.onReady(p=>{for(const k of keys){const e=document.getElementById(k);if(e.type==='checkbox')e.checked=p[k]!==false;else e.value=p[k]??'';}});
document.getElementById('save').onclick=async()=>{try{const p={};for(const k of keys){const e=document.getElementById(k);p[k]=e.type==='checkbox'?e.checked:e.value;}await PluginSDK.saveParams(p);document.getElementById('status').textContent='已保存';}catch(e){document.getElementById('status').textContent=e.message;}};
document.getElementById('test').onclick=async()=>{const r=await PluginSDK.sendAction('test_connection',{});document.getElementById('status').textContent=r.ok?JSON.stringify({message:r.message,accounts:r.accounts.map(a=>({id:a.id,name:a.name})),tasks:r.tasks.map(t=>({id:t.id,status:t.status,message:t.message}))},null,2):r.error;};
document.getElementById('cancel').onclick=async()=>{const r=await PluginSDK.sendAction('cancel_all',{});document.getElementById('status').textContent=r.message||r.error;};
</script></body></html>
