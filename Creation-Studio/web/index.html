<!doctype html>
<html lang="zh-CN" data-theme="studio-light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WENYUN.M-DESKTOP</title>
<link rel="icon" href="/favicon.svg" />
<link rel="stylesheet" href="/wmd.css" />
<link rel="stylesheet" href="/styles.css?v=proj15" />
<link rel="stylesheet" href="/skins.css?v=daylight-2" />
<link rel="stylesheet" href="/creative.css?v=3">
<link rel="stylesheet" href="/workbench.css?v=1" />
<style>
  /* 画面参考占位兜底：哪怕浏览器还吃着旧样式，也不能把占位撑成一大片 */
  .gu-ref-media { height:148px; max-height:148px; overflow:hidden; }
</style>
<link rel="stylesheet" href="/agent-workspace.css?v=7" />
</head>
<body>
<div id="root">
  <div class="wmd-app" id="app">
    <header class="wmd-topbar">
      <div class="wmd-brand">
        <div class="wmd-brand-mark">Y9</div>
        <div class="wmd-brand-text">
          <span class="wmd-brand-name">WENYUN.M-DESKTOP</span>
          <span class="wmd-brand-sub">CREATIVE DESK</span>
        </div>
      </div>
      <nav class="wmd-maintabs" id="nav">
        <button type="button" class="wmd-maintab" data-route="image" title="Ctrl+1" style="--i:0">图像创作台</button>
        <button type="button" class="wmd-maintab" data-route="studio" title="Ctrl+2" style="--i:1">视频创作台</button>
        <button type="button" class="wmd-maintab" data-route="script" title="Ctrl+3" style="--i:2">剧本创作台</button>
        <button type="button" class="wmd-maintab" data-route="assets" title="Ctrl+4" style="--i:3">素材库</button>
        <button type="button" class="wmd-maintab" data-route="tasks" title="Ctrl+5" style="--i:4">任务管理<span class="wmd-maintab-count" id="job-count"></span></button>
        <button type="button" class="wmd-maintab" data-route="media" title="Ctrl+6" style="--i:5">媒体库</button>
        <button type="button" class="wmd-maintab" data-route="compare" title="Ctrl+7" style="--i:6">对比</button>
      </nav>
      <span class="wmd-topbar-spacer"></span>
      <div class="wmd-topbar-right">
        <span class="wmd-svc" id="svc-lights" title="服务状态"><button type="button" class="wmd-svc-item" data-svc="agent" aria-label="智能体服务" title="点击启动/停止智能体"><i></i><span>智能体</span><em class="wmd-svc-act">启动</em></button><span class="wmd-svc-item" data-svc="manager"><i></i><button type="button" class="wmd-svc-label" data-open-manager="1" title="打开管理器页面">管理器</button><button type="button" class="wmd-svc-power" title="启动/停止管理器">启动</button></span></span>
        <button type="button" class="wmd-project-btn" id="project-btn" title="项目">项目</button>
        
        <div class="wmd-queue">
          <button type="button" class="wmd-queue-btn" id="queue-btn" title="任务队列">
            <svg class="wmd-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 5-10 5L2 7zM2 12l10 5 10-5M2 17l10 5 10-5"></path></svg>
            <span>队列 <span id="queue-count">0</span></span>
          </button>
        </div>
        <div class="wmd-volume" id="volume-box">
          <button type="button" class="wmd-iconbtn" id="mute-btn" title="静音">
            <svg class="wmd-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
          </button>
          <input class="wmd-volume-range" id="volume-range" type="range" min="0" max="100" step="1" value="60" aria-label="全局音量" style="--wmd-vol:60%" />
        </div>
        <button type="button" class="wmd-iconbtn" id="theme-btn" title="切换为亮色">
          <svg class="wmd-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        </button>
        <button type="button" class="wmd-iconbtn" id="settings-btn" title="设置 (Ctrl+,)">
          <svg class="wmd-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <span class="wmd-version">v2026.10.23</span>
      </div>
    </header>

    <main id="view" class="wmd-page"></main>

  </div>
</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" id="modal-panel" role="dialog" aria-modal="true"></div>
</div>
<div class="toasts" id="toasts"></div>
<input type="file" id="file-input" hidden multiple accept="image/*,audio/*" />
<script src="/wallpaper-library.js?v=daylight-1"></script>
<script src="/creative.js?v=3"></script>
<script src="/generation-params.js?v=1"></script>
<script src="/workbench-manager.js?v=1"></script>
<script src="/image-tasks.js?v=1"></script>
<script src="/events.js?v=ratio1"></script>
<script src="/agent-workspace.js?v=2"></script>
<script src="/app.js?v=proj15"></script>
</body>
</html>
