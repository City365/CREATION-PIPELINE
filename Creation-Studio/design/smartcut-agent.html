<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智能剪辑 · Creation Studio</title>
<style>
:root{
  /* 白昼模式（默认）：直接取创作台 studio-light 的 token，不是另配一套颜色 */
  --bg0:#ebe9f7;--bg1:#f8f7ff;--bg2:#fff6ee;--bg3:#ecebff;
  --line:#e0dcf0;--line2:#c7c2e6;
  --text:#1d1a33;--text2:#47425f;--muted:#6b6684;
  --accent:#ffc000;--accent-text:#8a6200;--accent-soft:rgba(230,172,0,.18);
  --accent-line:rgba(196,146,0,.45);--on-accent:#000;
  --user-bg:rgba(255,192,0,.16);--user-line:rgba(196,146,0,.42);
  --danger:#c0392b;
  --cover-a:#f4f2fd;--cover-b:#e6e3f7;--overlay:rgba(255,255,255,.9);
  --mono:"Roboto Mono",Consolas,"Cascadia Mono","Microsoft YaHei",monospace;
  --font:Roboto,"Segoe UI","Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
html[data-theme="studio-dark"]{
  --bg0:#000;--bg1:#0a0a0a;--bg2:#141414;--bg3:#202020;
  --line:#1a1a1a;--line2:#2a2a2a;
  --text:#f0f0f0;--text2:#969696;--muted:#7d7d7d;
  --accent:#ffc000;--accent-text:#ffce3e;--accent-soft:rgba(255,192,0,.12);
  --accent-line:rgba(255,192,0,.45);--on-accent:#000;
  --user-bg:rgba(255,192,0,.12);--user-line:rgba(255,192,0,.34);
  --danger:#e5484d;
  --cover-a:#101010;--cover-b:#161616;--overlay:rgba(0,0,0,.72);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg0);color:var(--text);font:13px/1.6 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
textarea{font:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.main{height:100%;display:flex;flex-direction:column;background:var(--bg0)}

/* ---------------------------------------------------------- 顶部细横条 */
.top{flex:none;display:flex;align-items:center;gap:10px;height:46px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg0);position:relative;z-index:2}
.top .ttl{font-size:13px;font-weight:500;letter-spacing:.02em;line-height:1}
.top .sub{font-size:11px;color:var(--muted)}
.top .grow{flex:1}
.eng{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px}
.eng button{height:24px;padding:0 10px;border-radius:6px;font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.eng button:hover{color:var(--text);background:var(--bg2)}
.eng button.is-on{background:var(--bg3);color:var(--text)}
.eng i{width:5px;height:5px;border-radius:50%;background:var(--muted);display:inline-block}
.eng button.is-on i{background:var(--accent)}
.ghost{height:26px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font-size:11px;color:var(--text2)}
.ghost:hover{color:var(--text);border-color:var(--accent-line)}

/* ---------------------------------------------------------- 消息流 */
.thread{flex:1;min-height:0;overflow-y:auto;padding:22px 24px 6px}
.inner{max-width:860px;margin:0 auto}

.welcome{max-width:780px;margin:5vh auto 0;text-align:center}
.welcome-ico{width:50px;height:50px;margin:0 auto 14px;display:grid;place-items:center;border:1px solid var(--line);border-radius:14px;color:var(--accent-text);font-size:22px}
.eyebrow{font-size:10px;letter-spacing:2.4px;color:var(--muted)}
.welcome h2{margin:12px 0;font-size:clamp(21px,2vw,28px);font-weight:300;line-height:1.45;letter-spacing:.01em;color:var(--text)}
.welcome>p{margin:0 0 22px;font-size:13px;line-height:1.85;color:var(--muted)}
.tips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;text-align:left}
.tip{display:flex;flex-direction:column;gap:5px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg1);text-align:left}
.tip:hover{border-color:var(--accent);background:var(--bg2)}
.tip b{font-size:12.5px;font-weight:500;color:var(--text)}
.tip span{font-size:11px;line-height:1.6;color:var(--muted)}
.tip em{font-style:normal;font-size:11px;color:var(--muted);opacity:.85}
.welcome-note{margin-top:18px;font-size:11px;color:var(--muted);line-height:1.75}

.msg{margin-bottom:22px}
.msg.is-user{display:flex;justify-content:flex-end}
.msg.is-user .bubble{max-width:74%;padding:12px 14px;border:1px solid var(--user-line);border-radius:10px;background:var(--user-bg);font-size:13.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.txt{font-size:13.5px;line-height:1.85;color:var(--text)}
.txt p{margin:0 0 8px}
.txt p:last-child{margin:0}
.txt code{font-family:var(--mono);font-size:12px;padding:1px 4px;border-radius:3px;background:var(--bg3)}
.txt b{font-weight:600}
.thinking{display:inline-flex;gap:3px;align-items:center;color:var(--muted);font-size:12px}
.thinking i{width:4px;height:4px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}
.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ---------------------------------------------------------- 剪辑单卡 */
.plan{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg1);overflow:hidden}
.plan-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.plan-head .l{display:flex;align-items:center;gap:8px;min-width:0}
.plan-head b{font-size:13px;font-weight:600}
.tag{font-size:10px;line-height:1;padding:3px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.tag.acc{border-color:var(--accent-line);color:var(--accent-text);background:var(--accent-soft)}
.tag.ok{border-color:var(--line2);color:var(--text2)}
.facts{display:flex;flex-wrap:wrap;gap:6px;padding:11px 14px 4px}
.fact{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg0);font-size:10.5px;color:var(--muted)}
.fact b{color:var(--text);font-weight:500}
.fact b.mono{font-family:var(--mono)}
.plan-note{padding:8px 14px 0;font-size:11px;line-height:1.7;color:var(--muted)}
.plan-note b{color:var(--text2);font-weight:500}
details.shots{border-top:1px solid var(--line);margin-top:11px}
details.shots>summary{list-style:none;cursor:pointer;padding:9px 14px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
details.shots>summary::-webkit-details-marker{display:none}
details.shots>summary:hover{color:var(--text)}
.shot-tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.shot-tbl th{text-align:left;padding:5px 14px;font-weight:400;font-size:10px;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.shot-tbl td{padding:5px 14px;border-bottom:1px solid var(--line);color:var(--text2)}
.shot-tbl td.n{font-family:var(--mono);color:var(--muted);width:44px}
.shot-tbl td.d{font-family:var(--mono);width:62px;text-align:right}
.shot-tbl tr:hover td{background:var(--bg2);color:var(--text)}
.plan-foot{display:flex;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid var(--line);background:var(--bg0)}
.plan-foot .grow{flex:1}
.btn{height:28px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;font-size:12px;color:var(--text2)}
.btn:hover{color:var(--text);border-color:var(--accent-line);background:var(--bg2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.btn.pri:hover{background:#ffd23f;border-color:#ffd23f;color:var(--on-accent)}
.btn.sm{height:24px;padding:0 9px;font-size:11px}
.btn:disabled{opacity:.45;cursor:default}

/* ---------------------------------------------------------- 执行卡 */
.run{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg1);overflow:hidden}
.run-head{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.run-head b{font-size:12.5px;font-weight:600}
.run-head .st{font-size:11px;color:var(--muted);font-family:var(--mono)}
.run-head .grow{flex:1}
.bar{height:3px;background:var(--bg3);margin:0 14px;position:relative;overflow:hidden;border-radius:2px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);transition:width .18s linear}
.steps{max-height:212px;overflow-y:auto;padding:8px 14px 11px;
  mask-image:linear-gradient(to bottom,transparent 0,#000 14px)}
.step{display:flex;align-items:baseline;gap:8px;font-family:var(--mono);font-size:11px;line-height:1.75;color:var(--text2);padding:1px 0}
.step .n{width:18px;color:var(--muted);flex:none;text-align:right}
.step .t{color:var(--text);flex:none}
.step .a{flex:1;min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .s{flex:none;color:var(--muted)}
.step.is-run .s{color:var(--accent-text)}
.step.is-wait{opacity:.42}

/* ---------------------------------------------------------- 产物卡 */
.out{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg1);overflow:hidden}
.cover{position:relative;height:132px;border-bottom:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:11px;
  background:repeating-linear-gradient(135deg,var(--cover-a) 0 10px,var(--cover-b) 10px 20px)}
.cover .ct{position:absolute;left:12px;bottom:9px;font-size:10.5px;color:var(--muted)}
.cover .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--overlay);display:grid;place-items:center;color:var(--text);font-size:14px}
.cover .play:hover{border-color:var(--accent);color:var(--accent-text)}
.cover .dur{position:absolute;right:9px;bottom:8px;font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--overlay);color:var(--text)}
.out-body{padding:11px 14px;display:flex;flex-direction:column;gap:7px}
.path-line{display:flex;align-items:flex-start;gap:6px}
.path-line .k{flex:none;font-size:10px;color:var(--muted);padding-top:2px;width:52px}
.path{font-family:var(--mono);font-size:11.5px;line-height:1.65;color:var(--text);word-break:break-all;user-select:text}
.out-meta{display:flex;flex-wrap:wrap;gap:6px}
.out-foot{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 12px}
.warn{margin-top:2px;border-left:2px solid var(--accent);padding:7px 9px;background:var(--accent-soft);font-size:11px;line-height:1.7;color:var(--text2)}
.warn b{color:var(--accent-text);font-weight:500}

/* ---------------------------------------------------------- 修改 diff 卡 */
.diff{margin-top:9px;border:1px solid var(--line);border-radius:10px;background:var(--bg1);padding:7px 0;font-family:var(--mono);font-size:11.5px}
.dl{display:flex;gap:7px;padding:2px 13px;line-height:1.7}
.dl .m{width:8px;flex:none}
.dl.del{color:var(--danger)}
.dl.add{color:var(--accent-text)}
.dl .k{color:var(--muted);width:64px;flex:none;font-family:var(--font);font-size:11px}

/* ---------------------------------------------------------- 输入区 */
.composer-area{flex:none;padding:8px 24px 14px;border-top:1px solid var(--line);background:var(--bg0)}
.ctx{display:flex;flex-wrap:wrap;gap:6px;max-width:860px;margin:0 auto 6px}
.ctx>span{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border:1px solid var(--line);border-radius:6px;font-size:10px;color:var(--muted);background:var(--bg1)}
.ctx>span b{font-weight:400;color:var(--text2)}
.composer{position:relative;max-width:860px;margin:0 auto;border:1px solid var(--line);border-radius:12px;background:var(--bg1);padding:6px 8px 4px}
.composer:focus-within{border-color:var(--accent)}
.composer textarea{width:100%;border:0;outline:none;background:transparent;color:var(--text);font-size:13px;line-height:1.7;resize:none;min-height:44px;max-height:180px;font-family:var(--font)}
.composer textarea::placeholder{color:var(--muted)}
.cbar{display:flex;align-items:center;gap:6px;padding:2px 0}
.cbtn{height:24px;display:inline-flex;align-items:center;gap:4px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg0);color:var(--muted);font-size:10px}
.cbtn:hover{color:var(--text);border-color:var(--accent-line)}
.cbtn.on{color:var(--accent-text);border-color:var(--accent-line)}
.cbar .grow{flex:1}
.stat{font-family:var(--mono);font-size:10px;color:var(--muted)}
.send{height:28px;padding:0 14px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:var(--on-accent);font-size:12px}
.send:hover{background:#ffd23f;border-color:#ffd23f}
.send:disabled{opacity:.45;cursor:default}
.hintline{max-width:860px;margin:6px auto 0;font-size:10px;color:var(--muted)}
.hintline kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 3px}

@media (max-width:900px){
  .thread{padding:16px 14px 4px}
  .composer-area{padding:8px 14px 12px}
  .plan-foot{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="main">

  <div class="top">
    <span class="ttl">智能剪辑</span>
    <span class="sub" id="topSub">一句话说清怎么剪，智能体出剪辑单、执行、回片</span>
    <span class="grow"></span>
    <div class="eng" id="eng">
      <button type="button" data-engine="jianying" class="is-on"><i></i>剪映草稿</button>
      <button type="button" data-engine="concat"><i></i>Concat 引擎</button>
    </div>
    <button type="button" class="ghost" id="btn-theme">☀ 白昼</button>
    <button type="button" class="ghost" id="btn-new">新会话</button>
  </div>

  <div class="thread" id="thread"><div class="inner" id="inner"></div></div>

  <div class="composer-area">
    <div class="ctx">
      <span>项目 <b>雪山等你</b></span>
      <span>引擎 <b id="ctxEngine">剪映草稿</b></span>
      <span>素材 <b>媒体库 · 第 01–03 集</b></span>
      <span>产出 <b id="ctxOut">草稿目录</b></span>
    </div>
    <div class="composer">
      <textarea id="input" rows="2" placeholder="说说这一版怎么剪，比如：第 01 集按台词卡点剪一版，竖屏，字幕贴底，音乐轻一点"></textarea>
      <div class="cbar">
        <button type="button" class="cbtn" id="btn-skill">＠ 智能剪辑</button>
        <button type="button" class="cbtn on">工作区权限</button>
        <span class="grow"></span>
        <span class="stat" id="stat">上下文 12,480 token · 31 步预算</span>
        <button type="button" class="send" id="btn-send">发送</button>
      </div>
    </div>
    <div class="hintline"><kbd>Enter</kbd> 发送，<kbd>Shift</kbd>+<kbd>Enter</kbd> 换行；执行中可以先说下一版要改什么。</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ======================================================================
     智能剪辑 · 设计稿（对话即流程）
     · 用户只说人话，智能体读媒体库 → 出剪辑单 → 调执行引擎 → 回成片地址。
     · 二级菜单的两个引擎在这里是「执行后端」：同一个剪辑单，两条落地路径。
         剪映  : 写草稿（转场 453 / 字幕轨 / 曲库 BGM / ducking），成片要在剪映里导出
         Concat: 真引擎（预览帧 / 本地识别字幕 / export_wait 进度），直接出 mp4
     · 界面不做时间线拖拽 —— 那件事在剪映里做更快。这里只做「说 → 定 → 跑 → 看」。
     ====================================================================== */

  var CHARS_PER_SEC = 4.2; // 台词折算：每秒 4.2 字

  var EPS = [
    { id: 'ep1', num: 1, name: '第 01 集 · 她走了九十九天', dir: '第01集', shots: [
      { no: 1, dur: 4.2, line: '她走了九十九天' },
      { no: 2, dur: 3.6, line: '每天同一班车' },
      { no: 3, dur: 5.0, line: '雪山脚下的站牌' },
      { no: 4, dur: 2.8, line: '' },
      { no: 5, dur: 6.4, line: '你终于来了' },
      { no: 6, dur: 4.5, line: '我以为你不会等' },
      { no: 7, dur: 3.2, line: '我一直都在' },
      { no: 8, dur: 5.8, line: '风把话吹散了一半' },
      { no: 9, dur: 7.0, line: '' },
      { no: 10, dur: 4.4, line: '票根还在我口袋里' },
      { no: 11, dur: 3.9, line: '那就再走一次' },
      { no: 12, dur: 6.0, line: '九十九天，换一班车' }
    ] },
    { id: 'ep2', num: 2, name: '第 02 集 · 站牌上的名字', dir: '第02集', shots: [
      { no: 1, dur: 3.8, line: '站牌上多了一个名字' },
      { no: 2, dur: 4.6, line: '不是她写的' },
      { no: 3, dur: 2.9, line: '' },
      { no: 4, dur: 5.2, line: '你认得这个笔迹吗', has: false },
      { no: 5, dur: 4.1, line: '我认得' },
      { no: 6, dur: 6.2, line: '那是三年前的票根' },
      { no: 7, dur: 3.4, line: '' },
      { no: 8, dur: 5.6, line: '她回来过' }
    ] },
    { id: 'ep3', num: 3, name: '第 03 集 · 空车厢', dir: '第03集', shots: [
      { no: 1, dur: 4.0, line: '末班车，一个人都没有' },
      { no: 2, dur: 3.3, line: '' },
      { no: 3, dur: 5.4, line: '车票上印着明天的日期' },
      { no: 4, dur: 4.8, line: '我坐到了终点' },
      { no: 5, dur: 2.7, line: '' },
      { no: 6, dur: 6.1, line: '司机没有回头' },
      { no: 7, dur: 3.6, line: '到站了，下车吧' },
      { no: 8, dur: 5.0, line: '这不是终点站' },
      { no: 9, dur: 4.3, line: '' },
      { no: 10, dur: 6.6, line: '她站在站台上等我' }
    ] }
  ];

  var ENGINE_NAME = { jianying: '剪映草稿', concat: 'Concat 引擎' };

  var S = {
    engine: 'jianying',
    plan: null,
    running: false,
    started: false
  };

  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var pad = function (n) { return String(n).length < 2 ? '0' + n : String(n); };
  var f1 = function (n) { return (Math.round(n * 10) / 10).toFixed(1); };
  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  function mmss(sec) {
    var m = Math.floor(sec / 60), s = sec - m * 60;
    return m + ':' + (s < 10 ? '0' : '') + f1(s);
  }
  function bytes(n) {
    if (n >= 1073741824) return f1(n / 1073741824) + ' GB';
    if (n >= 1048576) return f1(n / 1048576) + ' MB';
    return Math.round(n / 1024) + ' KB';
  }
  function epByNum(n) {
    for (var i = 0; i < EPS.length; i++) if (EPS[i].num === n) return EPS[i];
    return EPS[0];
  }
  function epById(id) {
    for (var i = 0; i < EPS.length; i++) if (EPS[i].id === id) return EPS[i];
    return EPS[0];
  }

  /* ------------------------------------------------------------- 指令解析 */
  function parse(text, base) {
    var o = {
      ep: base.ep, order: base.order, ratio: base.ratio, fps: base.fps,
      sub: base.sub, subSrc: base.subSrc, subSize: base.subSize,
      music: base.music, duck: base.duck, transition: base.transition,
      cap: base.cap, speed: base.speed, fx: base.fx
    };
    var m;
    if ((m = /第\s*([0-9]{1,2}|[一二三])\s*集/.exec(text))) {
      var n = '一二三'.indexOf(m[1]) >= 0 ? '一二三'.indexOf(m[1]) + 1 : Number(m[1]);
      o.ep = epByNum(n).id;
    }
    if (/竖屏|9:16|9：16/.test(text)) o.ratio = '9:16';
    if (/横屏|16:9|16：9/.test(text)) o.ratio = '16:9';
    if (/方屏|1:1|1：1/.test(text)) o.ratio = '1:1';
    if (/60\s*帧/.test(text)) o.fps = 60;
    if (/不要字幕|不带字幕|无字幕|去掉字幕/.test(text)) o.sub = false;
    else if (/字幕/.test(text)) o.sub = true;
    if (/自动字幕|识别字幕|自动识别/.test(text)) { o.sub = true; o.subSrc = 'asr'; }
    if ((m = /字幕[^0-9]{0,6}([0-9]{1,2})/.exec(text)) || (m = /([0-9]{1,2})\s*号字/.exec(text))) {
      o.subSize = Math.max(3, Math.min(20, Number(m[1])));
    }
    if (/台词卡点|卡点|按台词/.test(text)) o.order = 'line';
    else if (/镜号顺序|按镜号|按顺序/.test(text)) o.order = 'shot';
    else if (/均分|等长/.test(text)) o.order = 'fixed';
    if (/不要音乐|去掉音乐|不带音乐|无音乐/.test(text)) o.music = null;
    else if (/钢琴/.test(text)) o.music = '温柔钢琴 舒缓叙事';
    else if (/music|bm?g|音乐/i.test(text)) o.music = base.music || '温柔钢琴 舒缓叙事';
    if (/会让路|压低|duck/i.test(text)) o.duck = true;
    if (/闪黑/.test(text)) o.transition = '闪黑';
    else if (/叠化/.test(text)) o.transition = '叠化';
    else if (/推移/.test(text)) o.transition = '推移';
    else if (/不要转场|无转场|硬切/.test(text)) o.transition = '无';
    if (/加个特效|雪花|颗粒|光晕/.test(text)) o.fx = /雪花/.test(text) ? '雪花飘落' : (/颗粒/.test(text) ? '胶片颗粒' : '光影扫描');
    if ((m = /([0-9]{2,3})\s*秒(以内|之内|内)?/.exec(text)) && Number(m[1]) >= 8) o.cap = Number(m[1]);
    if (/1\.2\s*[×x倍]/.test(text)) o.speed = 1.2;
    if (/1\.5\s*[×x倍]/.test(text)) o.speed = 1.5;
    if (/(慢一点|0\.8)/.test(text)) o.speed = 0.8;
    return o;
  }

  /* ------------------------------------------------------------- 剪辑单 */
  function buildPlan(o) {
    var ep = epById(o.ep);
    var shots = ep.shots.filter(function (s) { return s.has !== false; });
    var missing = ep.shots.length - shots.length;
    var clips = shots.map(function (s) {
      var d = s.dur;
      if (o.order === 'line' && s.line) d = Math.max(1.2, s.line.length / CHARS_PER_SEC);
      if (o.order === 'fixed') d = 4;
      return { no: s.no, dur: d / (o.speed || 1), line: s.line || '' };
    });
    var raw = clips.reduce(function (a, c) { return a + c.dur; }, 0);
    var capped = false;
    if (o.cap && raw > o.cap) {
      var k = o.cap / raw;
      clips.forEach(function (c) { c.dur = Math.max(0.8, c.dur * k); });
      capped = true;
    }
    var total = clips.reduce(function (a, c) { return a + c.dur; }, 0);
    var subs = o.sub ? clips.filter(function (c) { return o.subSrc === 'asr' || c.line; }).length : 0;
    var ducks = (o.music && o.duck && subs) ? Math.max(1, Math.round(subs / 3)) : 0;
    var plan = {
      epId: ep.id, epName: ep.name, dir: ep.dir, clips: clips, total: total,
      order: o.order, ratio: o.ratio, fps: o.fps, sub: o.sub, subSrc: o.subSrc,
      subSize: o.subSize, music: o.music, duck: o.duck, transition: o.transition,
      fx: o.fx, cap: o.cap, capped: capped, speed: o.speed,
      subs: subs, ducks: ducks, missing: missing, engine: S.engine, rawTotal: raw
    };
    var st = stepsOf(plan);
    plan.steps = st;
    plan.calls = st.length;
    return plan;
  }

  function callPlan(p) {
    var list = [];
    if (p.engine === 'jianying') {
      list.push(['draft_create', 1]);
      list.push(['video_add', p.clips.length]);
      if (p.transition !== '无' && p.clips.length > 1) list.push(['transition_add', p.clips.length - 1]);
      if (p.subs) list.push(['text_add', p.subs]);
      if (p.music) list.push(['audio_add', 1]);
      if (p.ducks) list.push(['audio_duck', p.ducks]);
      if (p.fx) list.push(['effect_add', 1]);
      list.push(['draft_inspect', 1]);
      list.push(['draft_deploy', 1]);
    } else {
      list.push(['project_create', 1]);
      list.push(['media_import', p.clips.length]);
      list.push(['clips_add_sequence', 1]);
      if (p.subs && p.subSrc === 'asr') list.push(['captions_add', 1]);
      else if (p.subs) list.push(['title_add', p.subs]);
      if (p.fx) list.push(['effect_layer_add', 1]);
      list.push(['project_save', 1]);
      list.push(['export_start', 1]);
      list.push(['export_wait', 1]);
    }
    return list;
  }

  function stepsOf(p) {
    var steps = [], push = function (t, a) { steps.push({ tool: t, arg: a }); };
    var size = p.ratio === '16:9' ? '1920×1080' : p.ratio === '1:1' ? '1080×1080' : '1080×1920';
    if (p.engine === 'jianying') {
      push('draft_create', p.epName + ' ' + size + '@' + p.fps);
      p.clips.forEach(function (c) { push('video_add', '镜头 ' + pad(c.no) + ' ' + f1(c.dur) + 's'); });
      if (p.transition !== '无' && p.clips.length > 1) {
        for (var i = 0; i < p.clips.length - 1; i++) push('transition_add', '#' + i + ' ' + p.transition + ' 0.4s');
      }
      if (p.subs) {
        p.clips.filter(function (c) { return c.line; }).forEach(function (c, i) {
          if (i >= p.subs) return;
          push('text_add', c.line.slice(0, 12) + ' @' + f1(c.dur) + 's');
        });
      }
      if (p.music) {
        push('audio_add', p.music + ' vol 0.5');
        for (var k = 0; k < p.ducks; k++) push('audio_duck', '人声段 ' + (k + 1) + ' 0.5→0.12');
      }
      if (p.fx) push('effect_add', p.fx);
      push('draft_inspect', '核对轨道与时长');
      push('draft_deploy', '写入剪映草稿列表');
    } else {
      push('project_create', p.epName + ' ' + size + '@' + p.fps);
      p.clips.forEach(function (c) { push('media_import', '镜头 ' + pad(c.no) + '.mp4'); });
      push('clips_add_sequence', p.clips.length + ' 条落主轨');
      if (p.subs && p.subSrc === 'asr') push('captions_add', 'whisper 本地识别');
      else if (p.subs) {
        p.clips.filter(function (c) { return c.line; }).forEach(function (c, i) {
          if (i >= p.subs) return;
          push('title_add', c.line.slice(0, 12));
        });
      }
      if (p.fx) push('effect_layer_add', p.fx);
      push('project_save', '.concat 落盘');
      push('export_start', 'H.264 ' + size + '@' + p.fps);
      push('export_wait', '渲染进度');
    }
    return steps;
  }

      ['时长', mmss(before.total), mmss(after.total)],

      respond(text);
      $('#btn-send').disabled = false;
    }, 620 + Math.random() * 320);
  }

  function respond(text) {
    var opts = parse(text, S.plan ? planOpts(S.plan) : BASE);
    opts.engine = S.engine;
    var plan = buildPlan(opts);

    var switchTo = /concat/i.test(text) ? 'concat' : (/剪映/.test(text) ? 'jianying' : null);
    if (switchTo && switchTo !== S.engine) {
      setEngine(switchTo, true);
      plan.engine = switchTo;
      plan = buildPlan(opts);
      botMsg('这条走 <b>' + ENGINE_NAME[switchTo] + '</b>。');
    }

    if (!S.plan) {
      var facts = [];
      var ep = EPS.filter(function (e) { return e.id === plan.epId; })[0];
      facts.push('媒体库里有 <b>' + plan.epName + '</b>，' + ep.shots.length + ' 个镜头' + (plan.missing ? '（' + plan.missing + ' 个还没成片）' : '') + '。');
      if (plan.order === 'line') {
        var rawAll = ep.shots.filter(function (s) { return s.has !== false; }).reduce(function (a, s) { return a + s.dur; }, 0);
        facts.push('按台词卡点：每镜压到「台词说完 + 0.4 秒留白」，空镜保持原时长，整集从 ' + mmss(rawAll) + ' 压到 ' + mmss(plan.total) + '。');
      }
      if (plan.cap && plan.capped) facts.push('你要 ' + plan.cap + ' 秒，压到 ' + mmss(plan.total) + '。');
      else if (plan.cap) facts.push('你要 ' + plan.cap + ' 秒——按这套规则算下来是 ' + mmss(plan.total) + '，本来就在 ' + plan.cap + ' 秒以内，没再压。');
      if (plan.sub) facts.push(plan.subSrc === 'asr' ? '字幕交给本地识别。' : '字幕直接用分镜里的台词，' + plan.subs + ' 条。');
      if (plan.music) facts.push('BGM 用库里的「' + plan.music.split(' ')[0] + '」，人声段压低。');
      botMsg(facts.join(' '));
      planCard(plan);
      S.plan = plan;
      return;
    }

    // 已有剪辑单：做增量
    var before = S.plan;
    if (before.epId === plan.epId && before.total === plan.total && before.order === plan.order &&
        before.ratio === plan.ratio && before.subs === plan.subs && before.subSize === plan.subSize &&
        before.music === plan.music && before.transition === plan.transition) {
      botMsg('这句我没解析出要改的东西。可以说「字幕 12 号」「压到 45 秒」「换闪黑转场」「不要音乐」。');
      return;
    }
    diffCard(before, plan);
    planCard(plan, true);
    S.plan = plan;
  }

  function planOpts(p) {
    return {
      ep: p.epId, order: p.order, ratio: p.ratio, fps: p.fps, sub: p.sub, subSrc: p.subSrc,
      subSize: p.subSize, music: p.music, duck: p.duck, transition: p.transition,
      cap: p.cap, speed: p.speed, fx: p.fx
    };
  }

  /* ------------------------------------------------------------- 输入 */
  var input = $('#input');
  function autosize() {
    input.style.height = 'auto';
    input.style.height = Math.min(180, Math.max(44, input.scrollHeight)) + 'px';
  }
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send(input.value);
    }
  });
  $('#btn-send').addEventListener('click', function () { send(input.value); });

  /* ------------------------------------------------------------- 引擎切换 */
  function setEngine(engine, silent) {
    S.engine = engine;
    $$('#eng button').forEach(function (b) {
      b.classList.toggle('is-on', b.getAttribute('data-engine') === engine);
    });
    $('#ctxEngine').textContent = ENGINE_NAME[engine];
    $('#ctxOut').textContent = engine === 'jianying' ? '草稿目录' : 'mp4 地址';
    $('#topSub').textContent = engine === 'jianying'
      ? '剪映草稿：转场/字幕/BGM 写进草稿，成片在剪映里导出'
      : 'Concat 引擎：本地渲染 mp4，带预览帧和导出进度';
    if (!silent && !S.started) {
      inner.innerHTML = '';
      welcome();
    }
    if (!silent && S.plan) {
      S.plan = null;
      botMsg('切到 <b>' + ENGINE_NAME[engine] + '</b> 了，剪辑单重新来。刚才那份要看的话，翻上面的记录。');
    }
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest ? ev.target.closest('[data-engine],[data-tip],[data-act]') : null;
    if (!t) return;
    if (t.hasAttribute('data-engine')) { setEngine(t.getAttribute('data-engine')); return; }
    if (t.hasAttribute('data-tip')) { send(t.getAttribute('data-tip')); return; }

    var act = t.getAttribute('data-act');
    if (act === 'run') {
      if (!S.plan || S.running) return;
      t.disabled = true;
      t.textContent = '已执行';
      runPlan(t.closest('.plan'), S.plan);
      return;
    }
    if (act === 'tweak') {
      input.focus();
      input.placeholder = '比如：字幕加大到 12、压到 45 秒、换闪黑转场、不要音乐';
      return;
    }
    if (act === 'json') {
      var p = S.plan;
      var doc = {
        episode: p.epName, engine: p.engine, order: p.order,
        canvas: { ratio: p.ratio, fps: p.fps },
        clips: p.clips.map(function (c) { return { shot: c.no, duration: Number(f1(c.dur)), line: c.line }; }),
        subtitles: p.sub ? { mode: p.subSrc, size: p.subSize, count: p.subs } : null,
        bgm: p.music ? { keyword: p.music, duck_zones: p.ducks } : null,
        transition: p.transition,
        total: Number(f1(p.total))
      };
      var pre = t.closest('.plan').querySelector('pre.json');
      if (pre) { pre.remove(); t.textContent = '看剪辑单 JSON'; return; }
      var node = document.createElement('pre');
      node.className = 'json';
      node.style.cssText = 'margin:0;padding:12px 14px;border-top:1px solid var(--line);font:11px/1.65 var(--mono);color:var(--text2);overflow:auto;max-height:260px;background:var(--bg0)';
      node.textContent = JSON.stringify(doc, null, 2);
      t.closest('.plan').querySelector('.plan-foot').before(node);
      t.textContent = '收起 JSON';
      scrollDown();
      return;
    }
    if (act === 'again') { input.focus(); input.placeholder = '再说一版要改什么'; return; }
    if (act === 'switch-concat') {
      setEngine('concat');
      send('用 Concat 把这一集直接渲染成 mp4');
      return;
    }
  });

  $('#btn-new').addEventListener('click', function () {
    inner.innerHTML = '';
    S.plan = null;
    S.started = false;
    welcome();
  });

  /* ------------------------------------------------------------- 启动 */
  var qs = location.search;
  var themeBtn = $('#btn-theme');
  function setTheme(mode) {
    document.documentElement.setAttribute('data-theme', mode === 'dark' ? 'studio-dark' : 'light');
    themeBtn.textContent = mode === 'dark' ? '☾ 夜间' : '☀ 白昼';
  }
  themeBtn.addEventListener('click', function () {
    setTheme(document.documentElement.getAttribute('data-theme') === 'studio-dark' ? 'light' : 'dark');
  });
  if (/[?&]theme=dark/.test(qs)) setTheme('dark');
  if (/[?&]engine=concat/.test(qs)) setEngine('concat', true);
  welcome();
  if (/[?&]demo=1/.test(qs)) {
    setTimeout(function () {
      send('第 01 集按台词卡点剪一版，竖屏，字幕贴底，音乐轻一点');
    }, 200);
  }
  if (/[?&]demo=2/.test(qs)) {
    setTimeout(function () {
      send('第 01 集按台词卡点剪一版，竖屏，字幕贴底，音乐轻一点');
    }, 200);
    setTimeout(function () {
      var b = document.querySelector('[data-act="run"]');
      if (b) b.click();
    }, 1400);
  }
  if (/[?&]demo=3/.test(qs)) {
    setTimeout(function () {
      send('第 01 集按台词卡点剪一版，竖屏，字幕贴底，音乐轻一点');
    }, 200);
    setTimeout(function () { send('换成按镜号顺序，字幕加大到 12 号，加雪花特效'); }, 1500);
  }

  // 设计评审用：window.__cut 可以直接驱动对话
  window.__cut = { send: send, engine: setEngine, state: S };
})();
</script>
</body>
</html>
